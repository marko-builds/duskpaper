[project]
name = "duskpaper"
version = "0.1.0"
description = "Generative animated wallpapers for Wayland/Hyprland, rendered on your machine, at your resolution, with your seed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marko Stankovic" }]
keywords = ["wallpaper", "hyprland", "wayland", "generative", "ricing", "mpvpaper"]
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/marko-builds/duskpaper"

[project.scripts]
duskpaper = "duskpaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duskpaper"]
